[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "CAPE-parsers"
dynamic = ["version"]
description = "CAPE: Malware Configuration Extraction"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kevin O'Reilly", email = "kev@capesandbox.com" },
    { name = "doomedraven", email = "doomedraven@capesandbox.com" },
]
keywords = ["cape", "parsers", "malware", "configuration"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12, <4.0"
dependencies = [
    "pefile",
    "pycryptodomex>=3.20.0",
    "yara-python>=4.5.1",
    "yara-x>=1.0.0",
    "dnfile>=0.15.1",
    "dncil>=1.0.2",
    "unicorn>=2.1.4",
    "rat-king-parser>=4.1.0",
]

[project.optional-dependencies]
maco = ["maco>=1.1.8"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.7.2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["cape_parsers"]
artifacts = ["cape_parsers/utils/blzpack_lib.so"]

[tool.hatch.build.targets.sdist]
include = [
    "/cape_parsers",
    "/tests",
    "/tests_parsers",
    "/README.md",
    "/LICENSE",
]
artifacts = ["cape_parsers/utils/blzpack_lib.so"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/zip_compound"]

[tool.ruff]
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",       # pyflakes
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    # "I",       # isort
    # "N",       # pep8-naming
    "G",       # flake8-logging-format
]

ignore = [
    "E501",    # ignore due to conflict with formatter
    "N818",    # exceptions don't need the Error suffix
    "E741",    # allow ambiguous variable names
    "E402",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cape_parsers", "tests"]
default-section = "third-party"

[tool.mypy]
warn_unused_configs = true
