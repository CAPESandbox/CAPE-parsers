name: YARA tests

on:
  schedule:
  - cron: '0 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout test files repo
        uses: actions/checkout@v4
        with:
          repository: CAPESandbox/CAPE-TestFiles
          path: tests/data/

      - uses: ./.github/actions/python-setup/
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run YARA unit tests (yara-x)
        env:
          CAPE_PARSERS_YARA_BACKEND: yara_x
        run: uv run python -m pytest tests/test_yara_unit.py -s --import-mode=append

      - name: Run YARA unit tests (yara-python)
        env:
          CAPE_PARSERS_YARA_BACKEND: yara
        run: uv run python -m pytest tests/test_yara_unit.py -s --import-mode=append
