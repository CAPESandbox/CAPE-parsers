name: Python package

env:
  COLUMNS: 132

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Required for hatch-vcs dynamic versioning

      - name: Checkout test files repo
        uses: actions/checkout@v4
        with:
          repository: CAPESandbox/CAPE-TestFiles
          path: tests/data/

      - uses: ./.github/actions/python-setup/
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Ruff
        run: uv run ruff check . --output-format=github

      - name: Run unit tests (yara-x backend)
        env:
          CAPE_PARSERS_YARA_BACKEND: yara_x
        run: uv run python -m pytest tests -v

      - name: Run unit tests (yara-python backend)
        env:
          CAPE_PARSERS_YARA_BACKEND: yara
        run: uv run python -m pytest tests -v

      - name: See if any parser or packaging changed
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'cape_parsers/CAPE/core/*.py'
              - 'cape_parsers/CAPE/community/**.py'
              - 'cape_parsers/utils/**.py'
              - 'pyproject.toml'

      - name: Test parsers only if any parser changed
        if: steps.changes.outputs.src == 'true'
        run: uv run python -m pytest tests_parsers -s --import-mode=append
